apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- ../../base

images:
- name: ghcr.io/r00ti/demo-api
  newTag: sha-5433e4abbbc3a4290f5405602ffae64dde1f5efd

patches:
- target:
    kind: Deployment
    name: demo-api
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-secret